<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tripsite{% endblock %} · {{ trip.name if trip }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="theme-color" content="#00247d">
  <meta name="apple-mobile-web-app-title" content="Tripsite">
  <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}">{{ trip.name if trip else 'Tripsite' }}</a>
  <nav>
    <a href="{{ url_for('days') }}">Days</a>
    <a href="{{ url_for('legs') }}">Route</a>
    <a href="{{ url_for('ideas') }}">Ideas</a>
    <a href="{{ url_for('costs') }}">Costs</a>
    <a href="{{ url_for('tasks') }}">Tasks{% if open_task_count %} <span class="badge">{{ open_task_count }}</span>{% endif %}</a>
    <a href="{{ url_for('trip_map') }}">Map</a>
    <a href="{{ url_for('trips') }}">Trips</a>
  </nav>
  <span class="who">
    {% if me %}<a href="{{ url_for('whoami') }}" title="Switch user">{{ me.name }}</a>{% endif %}
  </span>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
